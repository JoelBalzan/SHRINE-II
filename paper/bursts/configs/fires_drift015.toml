name      = "pa_sigma_deg"
start     = 0.0
stop      = 45.0
step      = 1.0
#log_steps = false

[observation]
sefd             = 0 
target_snr       = 0
baseline_correct = false

[numerics]
n_cpus = 4
nseed  = 1

[output]
directory = "output"
