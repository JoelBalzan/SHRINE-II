[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "shrine2"
version = "0.1.0"
description = "Structure-maximising DMs of FRBs with the 1-sigma uncertainties of Balzan et al. (in prep.)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy", "scipy>=1.11", "matplotlib"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["shrine2"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
